<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>録画 · Recorder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@900&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#04262e; --ink2:#09404b; --band:#2b7886; --paper:#e4f8f7; --accent:#7ff0dc; --rec:#ff6b6b;
  --bh:clamp(56px,11vh,120px);
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--ink);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;overflow:hidden;display:grid;grid-template-rows:var(--bh) minmax(0,1fr) var(--bh);
  background:var(--ink);color:var(--paper);font-family:"Source Serif 4",Georgia,serif;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
body.studio{--bh:clamp(20px,3.5vh,30px)}
body.studio footer{padding-bottom:3px}
body.studio footer p{font-size:12px}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:100;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 1px,transparent 1px 3px)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.band{background:var(--band);margin:0 calc(-1*env(safe-area-inset-left,0px)) 0 calc(-1*env(safe-area-inset-right,0px))}
footer.band{display:grid;place-items:end center;padding-bottom:clamp(8px,1.6vh,18px)}
footer p{margin:0;font-style:italic;font-size:clamp(13px,1.9vmin,18px);padding:0 16px;text-align:center}
main{min-height:0;display:grid;place-items:center;padding:0 clamp(12px,3vw,32px)}
button{font:inherit;color:inherit;cursor:pointer}

/* landing */
#land{display:flex;flex-direction:column;align-items:center;text-align:center;gap:clamp(6px,1.4vh,16px)}
.ro{margin:0;font-style:italic;letter-spacing:.55em;padding-left:.55em;color:var(--accent);opacity:.9;font-size:clamp(12px,2.2vmin,20px)}
h1{margin:0;font:900 clamp(76px,22vmin,210px)/1 "Noto Serif JP","Source Serif 4",serif;color:var(--paper)}
.drop{width:min(92vw,640px);border:2px dashed var(--paper);padding:clamp(12px,2.4vh,26px) 16px;display:grid;gap:6px;justify-items:center}
.drop b{font-size:clamp(20px,3.6vmin,34px);font-weight:700}
.drop span{font-size:clamp(14px,2vmin,18px)}
.chips{display:flex;gap:10px;margin-top:8px}
.chip{background:transparent;border:1.5px solid rgba(228,248,247,.6);padding:6px 18px;font-size:clamp(14px,2vmin,18px)}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.go{margin-top:clamp(2px,1vh,10px);border:0;padding:clamp(8px,1.4vh,14px) clamp(34px,6vw,56px);font-weight:700;font-size:clamp(16px,2.6vmin,24px);
  letter-spacing:.3em;padding-left:calc(clamp(34px,6vw,56px) + .3em);background:var(--paper);color:var(--ink);transition:background .2s,color .2s}
.go:disabled{background:rgba(228,248,247,.22);color:rgba(228,248,247,.55);cursor:not-allowed}
#err{margin:0;min-height:1.3em;font-size:14px;color:var(--rec)}

/* studio */
#studio{width:100%;height:100%;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) min(340px,36vw);gap:14px;padding:10px 0}
.stage{min-height:0;display:flex;flex-direction:column;align-items:center;gap:10px}
.cvw{flex:1;min-height:0;width:100%;display:grid;place-items:center}
canvas{width:min(100%,calc((100dvh - var(--bh)*2 - 120px)*16/9));aspect-ratio:16/9;height:auto;background:#000;border:1px solid rgba(228,248,247,.3);touch-action:none;cursor:grab}
canvas:fullscreen{width:100vw;height:100vh;aspect-ratio:auto;object-fit:contain;border:0;background:#000}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;width:100%}
.btn{background:transparent;border:1.5px solid rgba(228,248,247,.5);padding:5px 12px;font-size:14px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.on{background:var(--paper);color:var(--ink)}
#rb{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:700;padding:6px 18px}
#rb.rec{background:var(--rec);border-color:var(--rec)}
#tm{font-variant-numeric:tabular-nums;min-width:4.5ch}
#st{font-size:13px;font-style:italic;flex-basis:100%;text-align:center;min-height:1.2em;margin:0}
#out{display:flex;align-items:center;gap:10px;font-size:13px}
#out video{height:54px;border:1px solid rgba(228,248,247,.3)}
#layers{overflow-y:auto;min-height:0;display:grid;gap:10px;align-content:start;padding-right:4px}
.card{border:1px solid rgba(228,248,247,.28);background:rgba(9,64,75,.55);padding:6px 10px;display:grid;gap:4px;font-size:12px;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px}
.card.on{border-color:var(--accent)}
.card header{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between}
.card h3{margin:0;font-size:16px}
.card .ic{display:flex;flex-wrap:wrap;gap:4px}
.card .ic button{background:transparent;border:1px solid rgba(228,248,247,.4);padding:2px 8px;font-size:12px}
.card label{display:grid;gap:0;font-size:11px}
.card label.ck{display:flex;align-items:center;gap:6px;font-size:12px}
input[type=range]{width:100%;accent-color:var(--accent)}
.hint{margin:0;font-size:14px;font-style:italic;opacity:.8;padding:6px 2px}
@media (max-width:780px){
  #studio{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  canvas{width:min(100%,calc((100dvh - var(--bh)*2)*.45*16/9))}
  .cvw{flex:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="band" id="top" aria-hidden="true"></div>

<main>
  <section id="land">
    <p class="ro">ro ku . ga .</p>
    <h1 lang="ja">録画</h1>
    <p class="ro">re · kō · dā .</p>
    <div class="drop" role="group" aria-label="Choose sources">
      <b>Choose what to record</b>
      <span>webcam, screen, or both</span>
      <div class="chips">
        <button class="chip" id="cCam" aria-pressed="false">Webcam</button>
        <button class="chip" id="cScr" aria-pressed="false">Screen</button>
      </div>
    </div>
    <button class="go" id="open" disabled>Open</button>
    <p id="err" role="alert"></p>
  </section>

  <section id="studio" hidden>
    <div class="stage">
      <div class="cvw"><canvas id="cv" width="1280" height="720" aria-label="Recording preview. Drag layers to move them, scroll to resize."></canvas></div>
      <div class="bar">
        <button class="btn" id="rb" disabled>Record</button>
        <span id="tm">00:00</span>
        <button class="btn" id="aCam">Add webcam</button>
        <button class="btn" id="aScr">Add screen</button>
        <button class="btn" id="fs">Full screen</button>
        <div id="out" hidden></div>
        <p id="st" role="status">Drag a layer to move it. Scroll over it to resize.</p>
      </div>
    </div>
    <aside id="layers" aria-label="Layers"></aside>
  </section>
</main>

<footer class="band"><p>Record your screen and webcam, right in your browser.</p></footer>

<script>
const $=s=>document.querySelector(s), W=1280, H=720, cv=$('#cv'), c=cv.getContext('2d');
const FILT='filter' in c, clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
let layers=[], sel=null, ac, dst, rec, chunks=[], tick, t0, blob, uid=0, drag=null, outUrl;

/* torn edges */
function torn(el,top){
  const n=36,p=[];
  for(let i=0;i<=n;i++){const y=top?52+Math.random()*48:Math.random()*48;p.push(`${(i/n*100).toFixed(1)}% ${y.toFixed(1)}%`)}
  p.reverse();
  el.style.clipPath=top?`polygon(0 0,100% 0,${p.join(',')})`:`polygon(0 100%,100% 100%,${p.join(',')})`;
}
torn($('#top'),true); torn($('footer'),false);

/* landing */
const want={cam:false,scr:false};
function chip(btn,k){btn.onclick=()=>{want[k]=!want[k];btn.setAttribute('aria-pressed',want[k]);$('#open').disabled=!(want.cam||want.scr)}}
chip($('#cCam'),'cam'); chip($('#cScr'),'scr');
$('#open').onclick=async()=>{
  document.body.classList.add('studio'); $('#land').hidden=true; $('#studio').hidden=false;
  torn($('#top'),true); torn($('footer'),false);
  if(want.scr) await add('scr'); if(want.cam) await add('cam');
};
$('#aCam').onclick=()=>add('cam'); $('#aScr').onclick=()=>add('scr');
function fs(){
  if(document.fullscreenElement)return document.exitFullscreen();
  (cv.requestFullscreen?cv.requestFullscreen():Promise.reject()).catch(()=>msg('Full screen is blocked here. Open the page in its own tab.'));
}
$('#fs').onclick=fs; cv.addEventListener('dblclick',fs);
const msg=t=>{$('#st').textContent=t; $('#err').textContent=t};

/* sources */
async function add(kind){
  if(layers.some(l=>l.kind===kind)){msg(`${kind==='cam'?'Webcam':'Screen'} is already added.`);return}
  try{
    ac=ac||new AudioContext(); dst=dst||ac.createMediaStreamDestination(); ac.resume();
    let s;
    if(kind==='cam'){
      const v={width:{ideal:1280},height:{ideal:720}};
      try{s=await navigator.mediaDevices.getUserMedia({video:v,audio:{echoCancellation:true,noiseSuppression:true}})}
      catch(e){s=await navigator.mediaDevices.getUserMedia({video:v})}
    }else s=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:30},audio:true});
    const v=document.createElement('video'); v.muted=true; v.playsInline=true; v.srcObject=s; await v.play();
    const L={id:++uid,kind,name:kind==='cam'?'Webcam':'Screen',v,s,x:0,y:0,w:1,zoom:1,px:.5,py:.5,vol:100,mute:false,show:true,
      retouch:kind==='cam',smooth:.5,bright:.3,warm:.3,mirror:kind==='cam'};
    if(s.getAudioTracks().length){
      L.g=ac.createGain(); L.src=ac.createMediaStreamSource(new MediaStream(s.getAudioTracks())); L.src.connect(L.g); L.g.connect(dst);
    }
    s.getVideoTracks()[0].addEventListener('ended',()=>remove(L));
    kind==='scr'?layers.unshift(L):layers.push(L);
    if(layers.length===2) pip(layers.find(l=>l.kind==='cam'));
    sel=L; render(); msg('Drag a layer to move it. Scroll over it to resize.');
  }catch(e){
    msg(e&&e.name==='NotAllowedError'?'Permission was denied. Allow access and try again, or open this page in its own tab.':`Couldn’t start the ${kind==='cam'?'webcam':'screen capture'}. ${e&&e.message||''}`);
  }
}
function pip(L){
  if(!L)return; L.w=.26; const h=L.w*W*L.v.videoHeight/L.v.videoWidth;
  L.x=W-L.w*W-28; L.y=H-h-28;
}
function remove(L){
  L.s.getTracks().forEach(t=>t.stop()); try{L.src&&L.src.disconnect();L.g&&L.g.disconnect()}catch(e){}
  layers=layers.filter(l=>l!==L); if(sel===L)sel=layers[layers.length-1]||null; render();
}
const gain=L=>{if(L.g)L.g.gain.value=L.mute?0:L.vol/100};

/* layer panel */
const byId=id=>layers.find(l=>l.id==id);
function sl(L,k,lab,min,max,step){return `<label>${lab}<input type="range" data-id="${L.id}" data-k="${k}" min="${min}" max="${max}" step="${step}" value="${L[k]}"></label>`}
function ck(L,k,lab){return `<label class="ck"><input type="checkbox" data-id="${L.id}" data-k="${k}" ${L[k]?'checked':''}>${lab}</label>`}
function render(){
  $('#rb').disabled=!layers.length && !(rec&&rec.state==='recording');
  $('#layers').innerHTML=layers.length?[...layers].reverse().map(L=>`
  <article class="card ${L===sel?'on':''}" data-id="${L.id}">
    <header><h3>${L.name}</h3><div class="ic">
      <button data-act="show">${L.show?'Hide':'Show'}</button>
      ${L.g?`<button data-act="mute">${L.mute?'Unmute':'Mute'}</button>`:''}
      <button data-act="up">Raise</button><button data-act="dn">Lower</button><button data-act="del">Remove</button></div></header>
    ${L!==sel?'':`<div class="grid">${L.g?sl(L,'vol','Volume',0,150,1):''}${sl(L,'w','Size',.1,1.5,.01)}${sl(L,'zoom','Crop zoom',1,4,.01)}${sl(L,'px','Pan ↔',0,1,.01)}${sl(L,'py','Pan ↕',0,1,.01)}${L.kind==='cam'?ck(L,'mirror','Mirror')+ck(L,'retouch','Retouch')+(FILT?sl(L,'smooth','Smooth',0,1,.01)+sl(L,'bright','Brighten',0,1,.01)+sl(L,'warm','Warmth',0,1,.01):''):''}</div>`}
  </article>`).join(''):'<p class="hint">No sources yet. Add a webcam or screen below the preview.</p>';
}
$('#layers').addEventListener('input',e=>{
  const t=e.target,L=byId(t.dataset.id); if(!L||!t.dataset.k)return;
  L[t.dataset.k]=t.type==='checkbox'?t.checked:+t.value; if(t.dataset.k==='vol')gain(L);
});
$('#layers').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'), card=e.target.closest('.card'); if(!card)return;
  const L=byId(card.dataset.id); if(!L)return;
  if(!b){if(sel!==L){sel=L;render()}return}
  const a=b.dataset.act,i=layers.indexOf(L);
  if(a==='show')L.show=!L.show;
  if(a==='mute'){L.mute=!L.mute;gain(L)}
  if(a==='up'&&i<layers.length-1)[layers[i],layers[i+1]]=[layers[i+1],layers[i]];
  if(a==='dn'&&i>0)[layers[i],layers[i-1]]=[layers[i-1],layers[i]];
  if(a==='del')return remove(L);
  sel=L; render();
});

/* canvas interaction */
const rectOf=L=>({x:L.x,y:L.y,w:L.w*W,h:L.w*W*L.v.videoHeight/L.v.videoWidth});
const pt=e=>{const r=cv.getBoundingClientRect(),s=Math.min(r.width/W,r.height/H),ox=(r.width-W*s)/2,oy=(r.height-H*s)/2;return{x:(e.clientX-r.left-ox)/s,y:(e.clientY-r.top-oy)/s}};
const hit=(p)=>[...layers].reverse().find(L=>{if(!L.show)return false;const r=rectOf(L);return p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h});
cv.addEventListener('pointerdown',e=>{
  const p=pt(e),L=hit(p); if(!L)return;
  drag={L,dx:p.x-L.x,dy:p.y-L.y}; cv.setPointerCapture(e.pointerId); cv.style.cursor='grabbing';
  if(sel!==L){sel=L;render()}
});
cv.addEventListener('pointermove',e=>{if(!drag)return;const p=pt(e);drag.L.x=p.x-drag.dx;drag.L.y=p.y-drag.dy});
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,()=>{drag=null;cv.style.cursor='grab'}));
cv.addEventListener('wheel',e=>{
  const L=hit(pt(e))||sel; if(!L)return; e.preventDefault();
  L.w=clamp(L.w*(e.deltaY<0?1.05:.95),.1,1.5);
  const i=document.querySelector(`[data-id="${L.id}"][data-k="w"]`); if(i)i.value=L.w;
},{passive:false});

/* compositing */
function draw(){
  c.filter='none'; c.globalAlpha=1; c.fillStyle='#000'; c.fillRect(0,0,W,H);
  let any=false;
  for(const L of layers){
    const v=L.v; if(!L.show||v.readyState<2||!v.videoWidth)continue; any=true;
    const vw=v.videoWidth,vh=v.videoHeight,dw=L.w*W,dh=dw*vh/vw,sw=vw/L.zoom,sh=vh/L.zoom,sx=(vw-sw)*L.px,sy=(vh-sh)*L.py;
    c.save();
    if(L.mirror){c.translate(L.x+dw,L.y);c.scale(-1,1)}else c.translate(L.x,L.y);
    if(L.kind==='cam'&&c.roundRect&&L.w<.9){c.beginPath();c.roundRect(0,0,dw,dh,22);c.clip()}
    const paint=()=>c.drawImage(v,sx,sy,sw,sh,0,0,dw,dh);
    if(L.retouch&&FILT){
      const tone=`brightness(${1+L.bright*.25}) saturate(${1+L.warm*.35})`;
      c.filter=`${tone} contrast(${1-L.smooth*.06})`; paint();
      if(L.smooth>0){c.globalAlpha=L.smooth*.65;c.filter=`blur(${Math.max(1.5,dw/110)}px) ${tone}`;paint()}
    }else paint();
    c.restore();
  }
  if(!any){c.fillStyle='#7ff0dc';c.font='italic 34px "Source Serif 4",serif';c.textAlign='center';c.fillText('Add a webcam or screen to begin',W/2,H/2)}
  if(sel&&sel.show&&!document.fullscreenElement&&!(rec&&rec.state==='recording')){
    const r=rectOf(sel);c.setLineDash([12,8]);c.lineWidth=3;c.strokeStyle='#7ff0dc';c.strokeRect(r.x,r.y,r.w,r.h);c.setLineDash([]);
  }
}
(function loop(){draw();requestAnimationFrame(loop)})();
setInterval(()=>{if(document.hidden)draw()},33);

/* recording */
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
$('#rb').onclick=()=>{rec&&rec.state==='recording'?rec.stop():start()};
function start(){
  if(!layers.length||!window.MediaRecorder)return msg('Recording isn’t supported in this browser.');
  if(outUrl)URL.revokeObjectURL(outUrl); $('#out').hidden=true;
  const mime=['video/mp4;codecs=avc1.640028,mp4a.40.2','video/mp4;codecs=avc1,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));
  const tracks=[...cv.captureStream(30).getVideoTracks(),...(dst?dst.stream.getAudioTracks():[])];
  chunks=[]; rec=new MediaRecorder(new MediaStream(tracks),{mimeType:mime,videoBitsPerSecond:6e6});
  rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  rec.onstop=()=>{
    clearInterval(tick); $('#rb').textContent='Record'; $('#rb').classList.remove('rec'); render();
    blob=new Blob(chunks,{type:rec.mimeType||mime}); outUrl=URL.createObjectURL(blob);
    const o=$('#out'); o.hidden=false;
    o.innerHTML=`<video src="${outUrl}" controls muted></video><button class="btn" id="sv">Save recording</button>`;
    $('#sv').onclick=save; msg('Recording ready.');
  };
  rec.start(1000); t0=Date.now(); $('#rb').textContent='Stop'; $('#rb').classList.add('rec'); msg(mime.includes('mp4')?'Recording…':'Recording… (this browser can only save .webm)');
  tick=setInterval(()=>$('#tm').textContent=fmt(Math.floor((Date.now()-t0)/1000)),250); $('#tm').textContent='00:00';
}
async function save(){
  const ext=blob.type.includes('mp4')?'mp4':'webm', name=`recording-${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}.${ext}`;
  try{
    const d=window.claude&&await claude.use('downloads');
    if(d){await d.save({filename:name,data:blob});return}
  }catch(e){if(e&&e.code==='declined')return}
  const a=document.createElement('a'); a.href=outUrl; a.download=name; a.click();
}
</script>
</body>
</html>
