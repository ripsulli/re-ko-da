<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>録画 · Recorder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@900&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#04262e; --band:#2b7886; --paper:#e4f8f7; --accent:#7ff0dc; --rec:#ff6b6b;
  --bh:clamp(24px,4vh,34px);
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--ink);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;height:100%;overflow:hidden;display:grid;grid-template-rows:var(--bh) minmax(0,1fr) var(--bh);
  background:var(--ink);color:var(--paper);font-family:"Source Serif 4",Georgia,serif;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:100;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 1px,transparent 1px 3px)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.band{background:var(--band);margin:0 calc(-1*env(safe-area-inset-left,0px)) 0 calc(-1*env(safe-area-inset-right,0px))}
footer.band{display:grid;place-items:end center;padding-bottom:3px}
footer p{margin:0;font-style:italic;font-size:12px;padding:0 16px;text-align:center}
main{min-height:0;display:grid;padding:0 clamp(12px,3vw,32px)}
button,select{font:inherit;color:inherit;cursor:pointer}

#studio{width:100%;height:100%;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) min(300px,34vw);grid-template-rows:minmax(0,1fr);gap:12px;padding:6px 0}
.stage{min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px}
.tb{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.tb .fl{flex:1}
.sep{width:1px;height:22px;background:rgba(228,248,247,.3);margin:0 4px}
.brand{font:900 24px/1 "Noto Serif JP",serif;margin-right:4px;white-space:nowrap}
.brand .rom{font:italic 400 15px "Source Serif 4",serif;letter-spacing:.2em;color:var(--accent)}
.btn.on{background:var(--paper);color:var(--ink)}
.btn,select{background:transparent;border:1.5px solid rgba(228,248,247,.5);padding:4px 11px;font-size:14px}
select{padding:4px 6px}
select option{background:var(--ink)}
.btn:disabled,select:disabled{opacity:.4;cursor:not-allowed}
#rb{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:700;padding:4px 16px}
#rb.rec{background:var(--rec);border-color:var(--rec)}
#tm{font-variant-numeric:tabular-nums;font-size:14px}
#px{font-size:12px;opacity:.7}
.cvw{container-type:size;display:grid;place-items:start center;min-height:0}
canvas{--ar:1.7778;width:min(100cqw,calc(100cqh*var(--ar)));aspect-ratio:var(--ar);height:auto;background:#000;border:1px solid rgba(228,248,247,.3);touch-action:none}
canvas:fullscreen{width:100vw;height:100vh;aspect-ratio:auto;object-fit:contain;border:0}
#layers{overflow-y:auto;min-height:0;display:grid;gap:8px;align-content:start;padding-right:2px}
.card{border:1px solid rgba(228,248,247,.28);background:rgba(9,64,75,.55);padding:8px 10px;display:grid;gap:6px;font-size:12px;cursor:pointer}
.card.on{border-color:var(--accent)}
.card.over{outline:2px dashed var(--accent)}
.hd{display:flex;align-items:center;gap:6px}
.hd h3{margin:0;font-size:15px}
.grip{cursor:grab;display:grid;place-items:center;width:18px;height:22px;opacity:.7}
.ic{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.ic button{display:grid;place-items:center;background:transparent;border:1px solid rgba(228,248,247,.4);padding:3px 2px;font-size:12px;min-height:26px}
.ic button:disabled{opacity:.35;cursor:not-allowed}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
.card label{display:grid;font-size:11px}
.card label.ck{display:flex;align-items:center;gap:6px;font-size:12px}
input[type=range]{width:100%;accent-color:var(--accent);margin:2px 0}
.hint{margin:0;font-size:12px;font-style:italic;opacity:.75}
@media (max-width:780px){
  #studio{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .stage{grid-template-rows:auto auto}
  .cvw{container-type:normal}
  canvas{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="band" id="top" aria-hidden="true"></div>

<main>
  <section id="studio">
    <div class="stage">
      <div class="tb">
        <span class="brand" lang="ja">録画 <span class="rom">| re · kō · dā .</span></span>
        <button class="btn" id="aScr">Add screen</button>
        <button class="btn" id="aCam">Add webcam</button>
        <span class="sep"></span>
        <button class="btn on" data-mode="move">Move / resize</button>
        <button class="btn" data-mode="crop">Crop</button>
        <button class="btn" data-mode="zoom">Zoom</button>
        <button class="btn" id="zo" hidden aria-label="Zoom out">−</button>
        <button class="btn" id="zi" hidden aria-label="Zoom in">+</button>
        <span class="sep"></span>
        <select id="res" aria-label="Resolution (16:9)"><option value="360">360p</option><option value="480">480p</option><option value="720">720p</option><option value="1080">1080p</option><option value="1440">1440p</option><option value="2160">4K (2160p)</option></select>
        <span id="px"></span>
        <button class="btn" id="fs">Full screen</button>
        <span class="fl"></span>
        <span id="tm">00:00</span>
        <button class="btn" id="sv" hidden>Save</button>
        <button class="btn" id="rb" disabled>Record</button>
      </div>
      <div class="cvw"><canvas id="cv" width="1920" height="1080" aria-label="Recording preview"></canvas></div>
    </div>
    <aside id="layers" aria-label="Layers"></aside>
  </section>
</main>

<footer class="band"><p role="status">Click the preview to share a screen.</p></footer>

<script>
const $=s=>document.querySelector(s), cv=$('#cv'), c=cv.getContext('2d');
const FILT='filter' in c, clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
let W=1920,H=1080,Q=1080,layers=[],sel=null,ac,dst,rec,chunks=[],tick,t0,size=0,blob,outUrl,uid=0,drag=null,dnd=null,busy=false,mode='move';
const U=()=>W/1280;
const msg=t=>{$('footer p').textContent=t};
const HINT={move:'Resize: drag a corner or scroll over the layer. Drag the layer to move it.',crop:'Crop: drag any edge or corner.',zoom:'Zoom: scroll or use + / −. Drag inside the box to reposition.'};

/* torn edges */
function torn(el,top){
  const n=36,p=[];
  for(let i=0;i<=n;i++){const y=top?52+Math.random()*48:Math.random()*48;p.push(`${(i/n*100).toFixed(1)}% ${y.toFixed(1)}%`)}
  p.reverse();
  el.style.clipPath=top?`polygon(0 0,100% 0,${p.join(',')})`:`polygon(0 100%,100% 100%,${p.join(',')})`;
}
torn($('#top'),true); torn($('footer'),false);

/* canvas format: 16:9 or 9:16, 720p / 1080p / 1440p */
function setCanvas(q){
  const oldW=W; Q=q; W=Math.round(q*16/9/2)*2; H=q;
  cv.width=W;cv.height=H;
  layers.forEach(L=>{const k=W/oldW;L.x*=k;L.y*=k;L.w*=k;L.h*=k});
  $('#res').value=Q;$('#px').textContent=`${W}×${H}`;
}
$('#res').onchange=e=>setCanvas(+e.target.value);

$('#aCam').onclick=()=>add('cam'); $('#aScr').onclick=()=>add('scr');
function fs(){
  if(document.fullscreenElement)return document.exitFullscreen();
  (cv.requestFullscreen?cv.requestFullscreen():Promise.reject()).catch(()=>msg('Full screen is blocked here. Open the page in its own tab.'));
}
$('#fs').onclick=fs; cv.addEventListener('dblclick',()=>layers.length&&fs());
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{
  mode=b.dataset.mode; document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('on',x===b));
  $('#zi').hidden=$('#zo').hidden=mode!=='zoom'; msg(HINT[mode]);
});
$('#zi').onclick=()=>sel&&!sel.lock&&zoom(sel,.85); $('#zo').onclick=()=>sel&&!sel.lock&&zoom(sel,1/.85);

/* sources */
async function add(kind){
  if(busy)return;
  if(layers.some(l=>l.kind===kind)){msg(`${kind==='cam'?'Webcam':'Screen'} is already added.`);return}
  busy=true;
  try{
    ac=ac||new AudioContext(); dst=dst||ac.createMediaStreamDestination(); ac.resume();
    let s;
    if(kind==='cam'){
      const v={width:{ideal:1280},height:{ideal:720}};
      try{s=await navigator.mediaDevices.getUserMedia({video:v,audio:{echoCancellation:true,noiseSuppression:true}})}
      catch(e){s=await navigator.mediaDevices.getUserMedia({video:v})}
    }else s=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:30},audio:true});
    const v=document.createElement('video'); v.muted=true; v.playsInline=true; v.srcObject=s; await v.play();
    const L={id:++uid,kind,name:kind==='cam'?'Webcam':'Screen',v,s,vol:100,mute:false,show:true,lock:false,
      retouch:kind==='cam',smooth:.5,bright:.3,warm:.3,mirror:kind==='cam'};
    if(s.getAudioTracks().length){
      L.g=ac.createGain(); L.src=ac.createMediaStreamSource(new MediaStream(s.getAudioTracks())); L.src.connect(L.g); L.g.connect(dst);
    }
    s.getVideoTracks()[0].addEventListener('ended',()=>remove(L));
    kind==='scr'?layers.unshift(L):layers.push(L);
    fit(L); if(layers.length===2)layers.forEach(l=>l.kind==='cam'&&!l.lock&&fit(l));
    sel=L; render(); msg(HINT[mode]);
  }catch(e){
    msg(e&&e.name==='NotAllowedError'?'Permission was denied. Allow access and try again, or open this page in its own tab.':`Couldn’t start the ${kind==='cam'?'webcam':'screen capture'}. ${e&&e.message||''}`);
  }finally{busy=false}
}
/* geometry: box (x,y,w,h in canvas px) shows source window (sx,sy,sw,sh as 0-1 fractions) */
function fit(L){
  const vw=L.v.videoWidth,vh=L.v.videoHeight; L.sx=L.sy=0; L.sw=L.sh=1;
  if(L.kind==='cam'&&layers.length>1){L.w=W*.26;L.h=L.w*vh/vw;L.x=W-L.w-28*U();L.y=H-L.h-28*U()}
  else{const k=Math.min(W/vw,H/vh);L.w=vw*k;L.h=vh*k;L.x=(W-L.w)/2;L.y=(H-L.h)/2}
}
function zoom(L,f,fx=.5,fy=.5){
  const r=clamp(f,Math.max(.06/L.sw,.06/L.sh),Math.min(1/L.sw,1/L.sh)); if(L.mirror)fx=1-fx;
  const nw=L.sw*r,nh=L.sh*r;
  L.sx=clamp(L.sx+L.sw*fx-nw*fx,0,1-nw); L.sy=clamp(L.sy+L.sh*fy-nh*fy,0,1-nh); L.sw=nw; L.sh=nh;
}
function remove(L){
  L.s.getTracks().forEach(t=>t.stop()); try{L.src&&L.src.disconnect();L.g&&L.g.disconnect()}catch(e){}
  layers=layers.filter(l=>l!==L); if(sel===L)sel=layers[layers.length-1]||null; render();
}
const gain=L=>{if(L.g)L.g.gain.value=L.mute?0:L.vol/100};

/* layer panel */
const IC={up:'<path d="M12 19V5M5 12l7-7 7 7"/>',down:'<path d="M12 5v14M5 12l7 7 7-7"/>',grip:'<path d="M9 5h.01M15 5h.01M9 12h.01M15 12h.01M9 19h.01M15 19h.01" stroke-width="3"/>'};
const ic=n=>`<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
const byId=id=>layers.find(l=>l.id==id);
const sl=(L,k,lab,min,max,step)=>`<label>${lab}<input type="range" data-id="${L.id}" data-k="${k}" min="${min}" max="${max}" step="${step}" value="${L[k]}"></label>`;
const ck=(L,k,lab)=>`<label class="ck"><input type="checkbox" data-id="${L.id}" data-k="${k}" ${L[k]?'checked':''}>${lab}</label>`;
const bt=(a,t,dis)=>`<button data-act="${a}" ${dis?'disabled':''}>${t}</button>`;
const ar=(a,i,t)=>`<button data-act="${a}" title="${t}" aria-label="${t}">${ic(i)}</button>`;
function render(){
  $('#rb').disabled=!layers.length&&!(rec&&rec.state==='recording');
  $('#layers').innerHTML=layers.length?[...layers].reverse().map(L=>`
  <article class="card ${L===sel?'on':''}" data-id="${L.id}">
    <div class="hd"><span class="grip" draggable="true" title="Drag to reorder">${ic('grip')}</span><h3>${L.name}${L.lock?' (locked)':''}</h3></div>
    <div class="ic">${ar('up','up','Bring forward')}${ar('dn','down','Send backward')}${bt('show',L.show?'Hide':'Show')}${bt('mute',L.mute?'Unmute':'Mute',!L.g)}${bt('lock',L.lock?'Unlock':'Lock')}${bt('reset','Reset')}${bt('del','Delete')}</div>
    ${L.g?sl(L,'vol','Volume',0,150,1):'<p class="hint">No audio from this source.</p>'}
    ${L.kind==='cam'?`<div class="grid">${ck(L,'mirror','Mirror')}${ck(L,'retouch','Retouch')}${FILT?sl(L,'smooth','Smooth',0,1,.01)+sl(L,'bright','Brighten',0,1,.01)+sl(L,'warm','Warmth',0,1,.01):''}</div>`:''}
  </article>`).join(''):'<p class="hint">No sources yet. Click the preview or use Add screen / Add webcam.</p>';
}
const P=$('#layers');
P.addEventListener('input',e=>{
  const t=e.target,L=byId(t.dataset.id); if(!L||!t.dataset.k)return;
  L[t.dataset.k]=t.type==='checkbox'?t.checked:+t.value; if(t.dataset.k==='vol')gain(L);
});
P.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'),card=e.target.closest('.card'); if(!card)return;
  const L=byId(card.dataset.id); if(!L)return;
  if(!b){if(sel!==L){sel=L;render()}return}
  const a=b.dataset.act,i=layers.indexOf(L);
  if(a==='show')L.show=!L.show;
  if(a==='mute'){L.mute=!L.mute;gain(L)}
  if(a==='up'&&i<layers.length-1)[layers[i],layers[i+1]]=[layers[i+1],layers[i]];
  if(a==='dn'&&i>0)[layers[i],layers[i-1]]=[layers[i-1],layers[i]];
  if(a==='lock')L.lock=!L.lock;
  if(a==='reset')fit(L);
  if(a==='del')return remove(L);
  sel=L; render();
});
/* drag and drop reordering */
P.addEventListener('dragstart',e=>{
  const g=e.target.closest('.grip'); if(!g){e.preventDefault();return}
  const card=g.closest('.card'); dnd=card.dataset.id; e.dataTransfer.setData('text/plain',dnd); e.dataTransfer.setDragImage(card,10,10);
});
P.addEventListener('dragover',e=>{if(!dnd)return;e.preventDefault();document.querySelectorAll('.card.over').forEach(x=>x.classList.remove('over'));const t=e.target.closest('.card');t&&t.classList.add('over')});
P.addEventListener('drop',e=>{
  e.preventDefault(); const t=e.target.closest('.card'),D=byId(dnd),T=t&&byId(t.dataset.id); dnd=null;
  if(!D||!T||D===T)return render();
  const ti=layers.indexOf(T); layers.splice(layers.indexOf(D),1); layers.splice(ti,0,D); render();
});
P.addEventListener('dragend',()=>{dnd=null;render()});

/* direct manipulation on the preview */
const HS=['nw','n','ne','e','se','s','sw','w'], CUR={nw:'nwse-resize',se:'nwse-resize',ne:'nesw-resize',sw:'nesw-resize',n:'ns-resize',s:'ns-resize',e:'ew-resize',w:'ew-resize'};
const hlist=()=>mode==='crop'?HS:mode==='move'?['nw','ne','se','sw']:[];
const hp=(L,h)=>({x:L.x+(h.includes('w')?0:h.includes('e')?L.w:L.w/2),y:L.y+(h.includes('n')?0:h.includes('s')?L.h:L.h/2)});
const pt=e=>{const r=cv.getBoundingClientRect(),s=Math.min(r.width/W,r.height/H),ox=(r.width-W*s)/2,oy=(r.height-H*s)/2;return{x:(e.clientX-r.left-ox)/s,y:(e.clientY-r.top-oy)/s}};
const inside=(L,p)=>p.x>=L.x&&p.x<=L.x+L.w&&p.y>=L.y&&p.y<=L.y+L.h;
const hit=p=>[...layers].reverse().find(L=>L.show&&!L.lock&&inside(L,p));
const hitH=p=>{if(!sel||sel.lock||!sel.show)return;return hlist(sel).find(h=>{const d=hp(sel,h);return Math.abs(p.x-d.x)<=20*U()&&Math.abs(p.y-d.y)<=20*U()})};
const snap=L=>({x:L.x,y:L.y,w:L.w,h:L.h,sx:L.sx,sy:L.sy,sw:L.sw,sh:L.sh});
cv.addEventListener('pointerdown',e=>{
  if(!layers.length)return add('scr');
  const p=pt(e),h=hitH(p);
  if(h)drag={t:'h',h,L:sel,p0:p,o:snap(sel)};
  else{
    const L=hit(p); if(!L)return; if(sel!==L){sel=L;render()}
    drag={t:mode==='zoom'?'pan':'move',L,p0:p,o:snap(L)};
  }
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove',e=>{
  const p=pt(e);
  if(!drag){const h=hitH(p),L=hit(p);cv.style.cursor=!layers.length?'pointer':h?CUR[h]:L?(mode==='zoom'?'grab':'move'):'default';return}
  const{L,o,p0,h,t}=drag,dx=p.x-p0.x,dy=p.y-p0.y,vw=L.v.videoWidth,vh=L.v.videoHeight;
  if(t==='move'){L.x=o.x+dx;L.y=o.y+dy}
  else if(t==='pan'){
    L.sx=clamp(o.sx-(L.mirror?-1:1)*dx*o.sw/o.w,0,1-L.sw); L.sy=clamp(o.sy-dy*o.sh/o.h,0,1-L.sh);
  }else if(mode==='move'){
    const sx=h.includes('e')?1:-1,sy=h.includes('s')?1:-1,ax=sx>0?o.x:o.x+o.w,ay=sy>0?o.y:o.y+o.h;
    const nw=clamp((p.x-ax)*sx,40*U(),W*2);
    L.w=nw; L.h=o.h*nw/o.w; L.x=sx>0?ax:ax-nw; L.y=sy>0?ay:ay-L.h;
  }else{
    const k=o.w/(o.sw*vw),m=.05;
    if(/[we]/.test(h)){
      const left=h.includes('w'),d=dx/(k*vw)*(left?1:-1);
      let nsw;
      if(left!==L.mirror){L.sx=clamp(o.sx+d,0,o.sx+o.sw-m);nsw=o.sx+o.sw-L.sx}
      else{L.sx=o.sx;nsw=clamp(o.sx+o.sw-d,o.sx+m,1)-o.sx}
      L.sw=nsw; L.w=nsw*vw*k; L.x=left?o.x+o.w-L.w:o.x;
    }
    if(/[ns]/.test(h)){
      const top=h.includes('n'),d=dy/(k*vh);
      let nsh;
      if(top){L.sy=clamp(o.sy+d,0,o.sy+o.sh-m);nsh=o.sy+o.sh-L.sy}
      else{L.sy=o.sy;nsh=clamp(o.sy+o.sh+d,o.sy+m,1)-o.sy}
      L.sh=nsh; L.h=nsh*vh*k; L.y=top?o.y+o.h-L.h:o.y;
    }
  }
});
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,()=>{drag=null}));
cv.addEventListener('wheel',e=>{
  const p=pt(e),L=hit(p); if(!L||mode==='crop')return; e.preventDefault();
  if(mode==='zoom')zoom(L,e.deltaY<0?.9:1/.9,(p.x-L.x)/L.w,(p.y-L.y)/L.h);
  else{const nw=clamp(L.w*(e.deltaY<0?1.05:.95),40*U(),W*2),r=nw/L.w;L.x+=(L.w-nw)/2;L.y+=(L.h-L.h*r)/2;L.w=nw;L.h*=r}
},{passive:false});

/* compositing */
function draw(){
  const u=U(); c.filter='none'; c.globalAlpha=1; c.fillStyle='#000'; c.fillRect(0,0,W,H);
  let any=false;
  for(const L of layers){
    const v=L.v; if(!L.show||v.readyState<2||!v.videoWidth)continue; any=true;
    const vw=v.videoWidth,vh=v.videoHeight;
    c.save();
    if(L.kind==='cam'&&c.roundRect&&L.w<W*.9){c.beginPath();c.roundRect(L.x,L.y,L.w,L.h,22*u);c.clip()}
    if(L.mirror){c.translate(L.x+L.w,L.y);c.scale(-1,1)}else c.translate(L.x,L.y);
    const paint=()=>c.drawImage(v,L.sx*vw,L.sy*vh,L.sw*vw,L.sh*vh,0,0,L.w,L.h);
    if(L.retouch&&FILT){
      const tone=`brightness(${1+L.bright*.25}) saturate(${1+L.warm*.35})`;
      c.filter=`${tone} contrast(${1-L.smooth*.06})`; paint();
      if(L.smooth>0){c.globalAlpha=L.smooth*.65;c.filter=`blur(${Math.max(1.5,L.w/110)}px) ${tone}`;paint()}
    }else paint();
    c.restore();
  }
  if(!layers.length){c.fillStyle='#7ff0dc';c.font=`italic ${34*u}px "Source Serif 4",serif`;c.textAlign='center';c.fillText('Add a webcam or screen to begin',W/2,H/2)}
  if(sel&&sel.show&&!document.fullscreenElement&&!(rec&&rec.state==='recording')){
    c.lineWidth=3*u;c.strokeStyle=sel.lock?'#e4f8f7':'#7ff0dc';c.setLineDash(sel.lock?[4*u,8*u]:[12*u,8*u]);c.strokeRect(sel.x,sel.y,sel.w,sel.h);c.setLineDash([]);
    if(!sel.lock){c.fillStyle='#7ff0dc';for(const h of hlist(sel)){const d=hp(sel,h);c.fillRect(d.x-8*u,d.y-8*u,16*u,16*u)}}
  }
}
(function loop(){draw();requestAnimationFrame(loop)})();
setInterval(()=>{if(document.hidden)draw()},33);

/* recording */
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
$('#rb').onclick=()=>{rec&&rec.state==='recording'?rec.stop():start()};
function start(){
  if(!layers.length||!window.MediaRecorder)return msg('Recording isn’t supported in this browser.');
  if(outUrl)URL.revokeObjectURL(outUrl); $('#sv').hidden=true; $('#res').disabled=true;
  const mime=['video/mp4;codecs=avc1.640028,mp4a.40.2','video/mp4;codecs=avc1,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));
  const tracks=[...cv.captureStream(30).getVideoTracks(),...(dst?dst.stream.getAudioTracks():[])];
  chunks=[]; size=0; rec=new MediaRecorder(new MediaStream(tracks),{mimeType:mime,videoBitsPerSecond:Math.round(W*H*30*.13)});
  rec.ondataavailable=e=>{if(e.data.size){chunks.push(e.data);size+=e.data.size}};
  rec.onstop=()=>{
    clearInterval(tick); $('#rb').textContent='Record'; $('#rb').classList.remove('rec'); $('#res').disabled=false; render();
    blob=new Blob(chunks,{type:rec.mimeType||mime}); outUrl=URL.createObjectURL(blob);
    $('#sv').textContent=`Save .${blob.type.includes('mp4')?'mp4':'webm'}`; $('#sv').hidden=false; msg('Recording ready. Press Save to download it.');
  };
  rec.start(1000); t0=Date.now(); $('#rb').textContent='Stop'; $('#rb').classList.add('rec');
  msg(mime.includes('mp4')?`Recording ${W}×${H}…`:`Recording ${W}×${H}… (this browser can only save .webm)`);
  tick=setInterval(()=>$('#tm').textContent=fmt(Math.floor((Date.now()-t0)/1000))+' · '+(size/1048576).toFixed(0)+' MB',500); $('#tm').textContent='00:00 · 0 MB';
}
$('#sv').onclick=async()=>{
  const ext=blob.type.includes('mp4')?'mp4':'webm', name=`recording-${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}.${ext}`;
  try{
    const d=window.claude&&await claude.use('downloads');
    if(d){await d.save({filename:name,data:blob});return}
  }catch(e){if(e&&e.code==='declined')return}
  const a=document.createElement('a'); a.href=outUrl; a.download=name; a.click();
};
setCanvas(1080); render();
</script>
